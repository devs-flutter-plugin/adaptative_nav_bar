name: Reference style formatter

on:
  push:
    branches:
      - feat/reference-bottom-styles

permissions:
  contents: write

concurrency:
  group: reference-style-formatter
  cancel-in-progress: true

jobs:
  format:
    runs-on:
      - self-hosted
      - devs-flutter-plugin-ci
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/reference-bottom-styles

      - name: Apply analyzer and narrow-layout fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for name in [
              'lib/src/adaptive_bottom_nav_renderer.dart',
              'lib/src/adaptive_reference_bottom_nav_renderer.dart',
          ]:
              path = Path(name)
              text = path.read_text()
              text = text.replace(
                  'return requested.clamp(0, count - 1) as int;',
                  'return requested.clamp(0, count - 1);',
              )
              path.write_text(text)

          path = Path('lib/src/adaptive_reference_bottom_nav_renderer.dart')
          text = path.read_text()

          def replace_enclosing_call(source, needle, replacement):
              needle_pos = source.index(needle)
              start = source.rfind('AnimatedSize(', 0, needle_pos)
              if start < 0:
                  raise SystemExit(f'AnimatedSize before {needle!r} not found')
              depth = 0
              end = None
              for index in range(start, len(source)):
                  char = source[index]
                  if char == '(':
                      depth += 1
                  elif char == ')':
                      depth -= 1
                      if depth == 0:
                          end = index + 1
                          if end < len(source) and source[end] == ',':
                              end += 1
                          break
              if end is None:
                  raise SystemExit(f'Unbalanced call before {needle!r}')
              line_start = source.rfind('\n', 0, start) + 1
              indent = source[line_start:start]
              replacement = '\n'.join(
                  indent + line if line else line
                  for line in replacement.splitlines()
              )
              return source[:line_start] + replacement + source[end:]

          google = '''if (selected)
  Flexible(
    child: Padding(
      padding: EdgeInsetsDirectional.only(start: style.gap),
      child: Text(
        destination.label,
        key: ValueKey<String>(
          'google-selected-label-${destination.label}',
        ),
        maxLines: 1,
        overflow: TextOverflow.ellipsis,
        style: config.theme.labelTextStyle?.copyWith(
          color: foreground,
          fontWeight: FontWeight.w600,
        ),
      ),
    ),
  ),'''
          text = replace_enclosing_call(
              text,
              "'google-selected-label-${destination.label}'",
              google,
          )

          persistent = '''if (selected)
  Flexible(
    child: Padding(
      padding: EdgeInsetsDirectional.only(start: gap),
      child: Text(
        destination.label,
        maxLines: 1,
        overflow: TextOverflow.ellipsis,
        style: config.theme.labelTextStyle?.copyWith(
          color: foreground,
          fontWeight: FontWeight.w600,
        ),
      ),
    ),
  ),'''
          text = replace_enclosing_call(text, 'child: FlexibleLabel(', persistent)
          path.write_text(text)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply canonical Dart formatting
        run: dart format .

      - name: Commit formatted corrections
        run: |
          if git diff --quiet; then
            echo 'No formatter changes to commit.'
            exit 0
          fi
          git config user.name 'devs-flutter-plugin-ci'
          git config user.email '58450364+devstecnologia@users.noreply.github.com'
          git add .
          git commit -m 'fix: refine reference navigation geometry'
          git push origin HEAD:feat/reference-bottom-styles
