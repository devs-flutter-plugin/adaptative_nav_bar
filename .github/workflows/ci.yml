name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: adaptative-nav-bar-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    name: Apply reference renderer fixes
    runs-on:
      - self-hosted
      - devs-flutter-plugin-ci

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Refine source geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for file_name in (
              'lib/src/adaptive_bottom_nav_renderer.dart',
              'lib/src/adaptive_reference_bottom_nav_renderer.dart',
          ):
              path = Path(file_name)
              source = path.read_text()
              source = source.replace(
                  'return requested.clamp(0, count - 1) as int;',
                  'return requested.clamp(0, count - 1);',
              )
              path.write_text(source)

          path = Path('lib/src/adaptive_reference_bottom_nav_renderer.dart')
          source = path.read_text()

          def replace_call_containing(source, needle, replacement):
              needle_at = source.index(needle)
              start = source.rfind('AnimatedSize(', 0, needle_at)
              if start == -1:
                  raise RuntimeError('Expected AnimatedSize was not found')
              line_start = source.rfind('\n', 0, start) + 1
              indent = source[line_start:start]
              depth = 0
              end = None
              for offset, char in enumerate(source[start:], start):
                  if char == '(':
                      depth += 1
                  elif char == ')':
                      depth -= 1
                      if depth == 0:
                          end = offset + 1
                          if end < len(source) and source[end] == ',':
                              end += 1
                          break
              if end is None:
                  raise RuntimeError('Expected AnimatedSize was not balanced')
              block = '\n'.join(indent + line for line in replacement.splitlines())
              return source[:line_start] + block + source[end:]

          source = replace_call_containing(
              source,
              "'google-selected-label-${destination.label}'",
              """if (selected)
  Flexible(
    child: Padding(
      padding: EdgeInsetsDirectional.only(start: style.gap),
      child: Text(
        destination.label,
        key: ValueKey<String>(
          'google-selected-label-${destination.label}',
        ),
        maxLines: 1,
        overflow: TextOverflow.ellipsis,
        style: config.theme.labelTextStyle?.copyWith(
          color: foreground,
          fontWeight: FontWeight.w600,
        ),
      ),
    ),
  ),""",
          )

          source = replace_call_containing(
              source,
              'child: FlexibleLabel(',
              """if (selected)
  Flexible(
    child: Padding(
      padding: EdgeInsetsDirectional.only(start: gap),
      child: Text(
        destination.label,
        maxLines: 1,
        overflow: TextOverflow.ellipsis,
        style: config.theme.labelTextStyle?.copyWith(
          color: foreground,
          fontWeight: FontWeight.w600,
        ),
      ),
    ),
  ),""",
          )

          helper_start = source.index('class FlexibleLabel extends StatelessWidget')
          helper_end = source.index('class _IconLabelDestination', helper_start)
          source = source[:helper_start] + source[helper_end:]
          path.write_text(source)
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply canonical Dart formatting
        run: dart format .

      - name: Commit corrections
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'devs-flutter-plugin-ci'
          git config user.email '58450364+devstecnologia@users.noreply.github.com'
          git add .
          git commit -m 'fix: refine reference navigation geometry'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
