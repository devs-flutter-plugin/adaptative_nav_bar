name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on:
      - self-hosted
      - devs-flutter-plugin-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare runner dependencies
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xz-utils
          fi
          xz --version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Apply canonical formatting
        if: github.event_name == 'push'
        run: |
          dart format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: apply canonical Flutter formatting"
            git push origin HEAD:main
          fi

      - name: Check formatting on pull requests
        if: github.event_name == 'pull_request'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: flutter analyze

      - name: Test package
        run: flutter test --coverage

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Validate package publication
        run: dart pub publish --dry-run
