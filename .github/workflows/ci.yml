name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: adaptative-nav-bar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / Flutter 3.47.2
    runs-on:
      - self-hosted
      - devs-flutter-plugin-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner dependencies
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xz-utils
          fi
          xz --version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: flutter analyze

      - name: Test package
        run: flutter test --coverage

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Validate package publication
        run: dart pub publish --dry-run

  minimum-flutter:
    name: Minimum supported / Flutter 3.44.0
    runs-on:
      - self-hosted
      - devs-flutter-plugin-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner dependencies
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xz-utils
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze

      - name: Test package
        run: flutter test

  platform-builds:
    name: Builds / Android + Web JS + Web Wasm + Linux
    runs-on:
      - self-hosted
      - devs-flutter-plugin-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare runner dependencies
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xz-utils
          fi
          if ! pkg-config --exists gtk+-3.0 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Create build harness
        run: |
          rm -rf .ci_example
          cp -R example .ci_example
          cd .ci_example
          flutter create --platforms=android,web,linux .
          flutter pub get

      - name: Build Web JavaScript
        working-directory: .ci_example
        run: flutter build web --release

      - name: Build Web Wasm
        working-directory: .ci_example
        run: flutter build web --wasm --release

      - name: Build Android
        working-directory: .ci_example
        run: flutter build apk --debug

      - name: Build Linux
        working-directory: .ci_example
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --debug
