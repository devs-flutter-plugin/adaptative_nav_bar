name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: adaptative-nav-bar-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    name: Apply final navigation geometry refinements
    runs-on:
      - self-hosted
      - devs-flutter-plugin-ci

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Refine source geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/src/adaptive_reference_bottom_nav_renderer.dart')
          text = path.read_text()

          text = re.sub(r'^\s*showOnlySelectedLabel: true,\n', '', text, flags=re.M)
          text = text.replace('    required this.showOnlySelectedLabel,\n', '')
          text = text.replace('  final bool showOnlySelectedLabel;\n', '')

          old = '''    final double safeCenter = center.clamp(
              radius * shoulderFactor,
              size.width - radius * shoulderFactor,
            );
            final Path path = Path()..moveTo(0, 0);
            path.lineTo(safeCenter - radius * shoulderFactor, 0);
            path.cubicTo(
              safeCenter - radius,
              0,
              safeCenter - radius,
              radius * depthFactor,
              safeCenter,
              radius * depthFactor,
            );
            path.cubicTo(
              safeCenter + radius,
              radius * depthFactor,
              safeCenter + radius,
              0,
              safeCenter + radius * shoulderFactor,
              0,
            );'''
          if old not in text:
              old = '''    final double safeCenter = center.clamp(
      radius * shoulderFactor,
      size.width - radius * shoulderFactor,
    );
    final Path path = Path()..moveTo(0, 0);
    path.lineTo(safeCenter - radius * shoulderFactor, 0);
    path.cubicTo(
      safeCenter - radius,
      0,
      safeCenter - radius,
      radius * depthFactor,
      safeCenter,
      radius * depthFactor,
    );
    path.cubicTo(
      safeCenter + radius,
      radius * depthFactor,
      safeCenter + radius,
      0,
      safeCenter + radius * shoulderFactor,
      0,
    );'''
          new = '''    final double availableHalfWidth = math.max(
      0,
      math.min(center, size.width - center),
    );
    final double effectiveRadius = math.max(
      1,
      math.min(radius, availableHalfWidth / shoulderFactor),
    );
    final Path path = Path()..moveTo(0, 0);
    path.lineTo(center - effectiveRadius * shoulderFactor, 0);
    path.cubicTo(
      center - effectiveRadius,
      0,
      center - effectiveRadius,
      effectiveRadius * depthFactor,
      center,
      effectiveRadius * depthFactor,
    );
    path.cubicTo(
      center + effectiveRadius,
      effectiveRadius * depthFactor,
      center + effectiveRadius,
      0,
      center + effectiveRadius * shoulderFactor,
      0,
    );'''
          if old not in text:
              raise RuntimeError('Expected notch geometry block was not found')
          text = text.replace(old, new)
          text = text.replace('const SizedBox(height: 2),', 'const SizedBox(height: 4),')
          path.write_text(text)
          PY

      - name: Prepare runner dependencies
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xz-utils
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply canonical Dart formatting
        run: dart format lib/src/adaptive_reference_bottom_nav_renderer.dart test/adaptive_nav_geometry_test.dart

      - name: Commit refinements
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'devs-flutter-plugin-ci'
          git config user.email '58450364+devstecnologia@users.noreply.github.com'
          git add lib/src/adaptive_reference_bottom_nav_renderer.dart test/adaptive_nav_geometry_test.dart
          git commit -m 'fix: refine bottom navigation spacing and edge geometry'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
