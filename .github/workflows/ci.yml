name: Apply adaptive rail layout fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on:
      - self-hosted
      - devs-flutter-plugin-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply layout corrections
        run: |
          echo '' | base64 -d > /tmp/adaptive_nav_fix.py
          python3 /tmp/adaptive_nav_fix.py
          dart format lib test

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze package
        run: flutter analyze

      - name: Test package
        run: flutter test

      - name: Analyze example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/adaptive_nav_controller.dart lib/src/adaptive_nav_scaffold.dart test/adaptive_nav_controller_test.dart test/adaptive_nav_scaffold_test.dart README.md CHANGELOG.md
          git commit -m "fix: tighten adaptive rail layout"
          git push origin HEAD:main
