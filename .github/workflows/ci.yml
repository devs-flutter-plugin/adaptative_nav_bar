name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on:
      - self-hosted
      - devs-flutter-plugin-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare runner dependencies
        run: |
          if ! command -v xz >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xz-utils
          fi
          xz --version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install package dependencies
        run: flutter pub get

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Apply analyzer cleanup
        if: github.event_name == 'push'
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          for file_name in [
              'lib/src/adaptive_nav_bar_config.dart',
              'lib/src/adaptive_nav_destination.dart',
              'lib/src/adaptive_nav_motion.dart',
              'lib/src/adaptive_nav_presentation.dart',
              'lib/src/adaptive_nav_scaffold.dart',
              'lib/src/adaptive_nav_scroll_behavior.dart',
              'lib/src/adaptive_nav_theme.dart',
          ]:
              path = Path(file_name)
              text = path.read_text()
              text = text.replace("import 'package:flutter/foundation.dart';\n", '')
              path.write_text(text)

          controller = Path('lib/src/adaptive_nav_controller.dart')
          text = controller.read_text()
          marker = '// ignore_for_file: prefer_initializing_formals\n\n'
          if not text.startswith(marker):
              controller.write_text(marker + text)

          scaffold = Path('lib/src/adaptive_nav_scaffold.dart')
          text = scaffold.read_text()
          pattern = r'for \(final \(int index, AdaptiveNavDestination destination\)\s+in config\.destinations\.indexed\)\s+NavigationDestination\('
          replacement = 'for (final AdaptiveNavDestination destination in config.destinations)\n          NavigationDestination('
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one NavigationDestination loop, found {count}')
          scaffold.write_text(text)
          PY

          dart format .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "fix: resolve analyzer findings"
            git push origin HEAD:main
          fi

      - name: Check formatting on pull requests
        if: github.event_name == 'pull_request'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze package
        run: flutter analyze

      - name: Test package
        run: flutter test --coverage

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Validate package publication
        run: dart pub publish --dry-run
