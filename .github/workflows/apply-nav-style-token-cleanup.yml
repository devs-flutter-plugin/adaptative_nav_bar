name: Apply navigation style token cleanup

on:
  push:
    branches:
      - feat/reference-bottom-styles

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/reference-bottom-styles

      - name: Apply renderer cleanup
        run: python3 .github/scripts/apply_nav_style_tokens.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false

      - name: Format changed Dart files
        run: dart format lib/src/adaptive_reference_bottom_nav_renderer.dart lib/src/adaptive_standard_bottom_nav_style_config.dart

      - name: Remove temporary maintenance files
        run: |
          git rm .github/scripts/apply_nav_style_tokens.py
          git rm .github/workflows/apply-nav-style-token-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name 'devs-flutter-plugin-ci'
          git config user.email '58450364+devstecnologia@users.noreply.github.com'
          git add lib/src/adaptive_reference_bottom_nav_renderer.dart lib/src/adaptive_standard_bottom_nav_style_config.dart lib/adaptative_nav_bar.dart
          git commit -m 'refactor: centralize navigation style tokens'
          git push origin HEAD:feat/reference-bottom-styles
