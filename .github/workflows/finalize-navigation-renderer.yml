name: Finalize navigation renderer

on:
  push:
    branches:
      - feat/reference-bottom-styles

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feat/reference-bottom-styles

      - name: Apply final renderer cleanup
        run: python3 .github/scripts/finalize_navigation_renderer.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: false

      - name: Format renderer
        run: dart format lib/src/adaptive_reference_bottom_nav_renderer.dart

      - name: Validate renderer
        run: |
          flutter pub get
          flutter analyze
          flutter test test/adaptive_nav_styles_test.dart test/adaptive_nav_theme_tokens_test.dart test/adaptive_nav_geometry_test.dart

      - name: Remove temporary maintenance files
        run: |
          git rm .github/scripts/finalize_navigation_renderer.py
          git rm .github/workflows/finalize-navigation-renderer.yml

      - name: Commit renderer cleanup
        run: |
          git config user.name 'devs-flutter-plugin-ci'
          git config user.email '58450364+devstecnologia@users.noreply.github.com'
          git add lib/src/adaptive_reference_bottom_nav_renderer.dart
          git commit -m 'refactor: finalize navigation renderer metrics'
          git push origin HEAD:feat/reference-bottom-styles
